[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steamdeck-bridge"
version = "0.1.0"
description = "Real-time SteamOS/Bazzite now-playing + device bridge for Home Assistant (REST, WebSocket, MQTT discovery)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Brett", email = "brett@iotemylabs.com" }]
keywords = ["steamos", "bazzite", "steam-deck", "home-assistant", "mqtt", "gamescope"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "aiohttp>=3.9",
    "aiomqtt>=2.0",
    "vdf>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
steamdeck-bridge = "steamdeck_bridge.__main__:main"

[project.urls]
Documentation = "https://github.com/iotemylabs/steamos-hass-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/steamdeck_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
